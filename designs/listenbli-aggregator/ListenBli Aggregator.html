<style>
/* Base — only what the canvas and the three directions genuinely share. Each
   direction owns its own tokens in dir-*.css and is scoped under [data-dir]. */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #f0eee9;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input { font: inherit; }

/* The canvas renders artboard content inside a fixed-size card; reset text
   rendering there so each direction's own typography starts from a clean slate. */
.dc-card { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

/* Shared mono/tabular helper used by all three directions for readouts. */
.tnum { font-variant-numeric: tabular-nums; }

/* ?only=a|b|c renders one direction full-bleed at exact design size. */
.only { width: 1440px; height: 900px; overflow: hidden; }

/* ---- comparison table (canvas chrome, not part of any direction) --------- */
.cmp {
  width: 1440px;
  height: 580px;
  background: #fbfaf7;
  color: #26221c;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: 30px 40px 26px;
  display: flex;
  flex-direction: column;
}
.cmp__head, .cmp__row { display: grid; grid-template-columns: 156px repeat(3, 1fr); gap: 0 26px; }
.cmp__head { border-bottom: 2px solid #26221c; padding-bottom: 12px; }
.cmp__hcell { font-size: 13px; color: #6b6357; letter-spacing: 0.02em; }
.cmp__hcell b { display: block; font-size: 16px; color: #16130e; font-weight: 600; margin-bottom: 3px; }
.cmp__hcell span { font-size: 11.5px; color: #8a8175; }
.cmp__row { padding: 11px 0; border-bottom: 1px solid rgba(0, 0, 0, 0.09); }
.cmp__row:nth-child(odd) { background: rgba(0, 0, 0, 0.018); }
.cmp__cell { font-size: 13.5px; line-height: 1.5; color: #33302a; }
.cmp__cell--lead { font-size: 12px; font-weight: 600; color: #16130e; letter-spacing: 0.02em; }
.cmp__foot {
  margin-top: auto;
  padding-top: 16px;
  font-size: 13px;
  line-height: 1.65;
  color: #55504a;
  border-top: 2px solid #26221c;
}
.cmp__foot b { color: #16130e; }
</style>
</head>

<div id="root"></div>
